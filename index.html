function lmh(){A.innerHTML=hud()+`<h2>🔬 Métodos de diagnóstico parasitológico y análisis de muestras</h2>${LB}<div class="p">${CAT.map((c,j)=>`<button onclick="lmc(${j})">${c[1]} ${c[0]}<small>${c[2].length} métodos</small></button>`).join('')}<button onclick="lmact()">🎮 Actividades: muestra, método y resultados</button></div><button onclick="lab()">⬅ Laboratorio</button>`}
